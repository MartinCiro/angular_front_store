<div class="bg-white dark:bg-card-dark rounded-xl border border-slate-200 dark:border-slate-800 p-5">
  
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-2">
      <mat-icon class="text-primary">bolt</mat-icon>
      <h3 class="font-bold text-lg">Acciones Rápidas</h3>
    </div>
    <button class="text-sm text-primary hover:underline font-medium">
      Ver todas
    </button>
  </div>
  
  <!-- Actions Grid -->
  <div class="grid grid-cols-2 gap-3">
    @for (action of actions; track action.id) {
      <button (click)="onActionClick(action.action)"
              class="p-3 rounded-lg bg-slate-50 dark:bg-card-hover hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 border border-transparent hover:border-primary/30 flex flex-col items-center gap-2 text-center group">
        
        <!-- Icon -->
        <div class="size-10 rounded-full bg-primary/10 flex items-center justify-center group-hover:bg-primary/20 transition-colors">
          <mat-icon [ngClass]="getActionColor(action)" class="group-hover:scale-110 transition-transform">
            {{ action.icon }}
          </mat-icon>
        </div>
        
        <!-- Label -->
        <span class="text-xs font-medium text-slate-900 dark:text-white group-hover:text-primary transition-colors">
          {{ action.label }}
        </span>
        
        <!-- Description (tooltip on hover) -->
        @if (action.description) {
          <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 absolute top-0 left-1/2 -translate-x-1/2 -translate-y-full mt-1 px-2 py-1 bg-slate-900 dark:bg-slate-700 text-white text-xs rounded whitespace-nowrap pointer-events-none">
            {{ action.description }}
            <div class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2 rotate-45 size-2 bg-slate-900 dark:bg-slate-700"></div>
          </div>
        }
      </button>
    }
  </div>
  
  <!-- Recent Actions -->
  <div class="mt-6 pt-6 border-t border-slate-200 dark:border-slate-700">
    <h4 class="text-sm font-medium mb-3 flex items-center gap-2">
      <mat-icon class="text-slate-400 text-[16px]">history</mat-icon>
      Acciones Recientes
    </h4>
    
    <div class="space-y-2">
      <div class="flex items-center justify-between text-xs">
        <span class="text-subtle-text">Usuario creado</span>
        <span class="text-slate-500">Hace 5 min</span>
      </div>
      <div class="flex items-center justify-between text-xs">
        <span class="text-subtle-text">Entrada publicada</span>
        <span class="text-slate-500">Hace 2 horas</span>
      </div>
      <div class="flex items-center justify-between text-xs">
        <span class="text-subtle-text">Backup realizado</span>
        <span class="text-slate-500">Ayer</span>
      </div>
    </div>
  </div>
  
  <!-- Keyboard Shortcuts -->
  <div class="mt-4 pt-4 border-t border-slate-200 dark:border-slate-700">
    <h4 class="text-sm font-medium mb-2">Atajos de teclado</h4>
    <div class="flex flex-wrap gap-2">
      <kbd class="px-2 py-1 bg-slate-100 dark:bg-slate-800 text-xs rounded border border-slate-300 dark:border-slate-600">Ctrl + N</kbd>
      <span class="text-xs text-subtle-text">Nueva entrada</span>
      <kbd class="px-2 py-1 bg-slate-100 dark:bg-slate-800 text-xs rounded border border-slate-300 dark:border-slate-600">Ctrl + U</kbd>
      <span class="text-xs text-subtle-text">Crear usuario</span>
    </div>
  </div>
  
</div>
