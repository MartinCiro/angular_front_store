<div class="bg-white dark:bg-card-dark p-6 rounded-xl border border-slate-200 dark:border-slate-800 flex flex-col gap-3 relative overflow-hidden group hover:shadow-lg transition-all duration-300">
  
  <!-- Background Icon -->
  <div class="absolute right-0 top-0 p-3 opacity-10 group-hover:opacity-20 transition-opacity duration-300">
    <mat-icon class="text-8xl">{{ stat().icon }}</mat-icon>
  </div>
  
  <!-- Icon Container -->
  <div class="size-10 rounded-lg flex items-center justify-center"
       [ngClass]="stat().bgColor">
    <mat-icon [ngClass]="stat().iconColor">{{ stat().icon }}</mat-icon>
  </div>
  
  <!-- Content -->
  <div>
    <p class="text-subtle-text text-sm font-medium mb-1">{{ stat().title }}</p>
    <div class="flex items-baseline gap-2">
      <p class="text-2xl font-bold">{{ stat().value.toLocaleString() }}</p>
      <div class="flex items-center gap-1">
        <mat-icon class="text-sm" [ngClass]="trendColor">{{ trendIcon }}</mat-icon>
        <span class="text-sm font-medium" [ngClass]="{
          'text-emerald-500': stat().trend === 'positive',
          'text-red-500': stat().trend === 'negative',
          'text-slate-500': stat().trend === 'neutral'
        }">
          {{ stat().change }}
        </span>
      </div>
    </div>
  </div>
  
  <!-- Trend Indicator -->
  <div class="h-1 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mt-2">
    <div class="h-full rounded-full transition-all duration-500"
         [ngClass]="{
           'bg-emerald-500': stat().trend === 'positive',
           'bg-red-500': stat().trend === 'negative',
           'bg-slate-500': stat().trend === 'neutral'
         }"
         [style.width.%]="stat().trend === 'positive' ? 100 : 
                         stat().trend === 'negative' ? 30 : 50">
    </div>
  </div>
  
</div>
