<div 
  class="rounded-lg shadow-md overflow-hidden transform hover:-translate-y-1 transition-all duration-300 ease-in-out border cursor-pointer"
  [class]="isDarkMode() ? 'bg-gray-800 border-gray-700 hover:bg-gray-750' : 'bg-white border-gray-200 hover:bg-gray-50'"
  (click)="navigateToDetail()">
  
  <img [src]="post.imageUrl" [alt]="post.title" class="w-full h-48 object-cover">
  
  <div class="p-6">
    
    <h3 class="text-xl font-semibold mb-2" [class]="getTitleClasses()">
      {{ post.title }}
    </h3>
    
    <p class="text-sm mb-4" [class]="getTextClasses()">
      {{ post.description }}
    </p>
    
    <div class="flex items-center justify-between mt-4">
      <span class="text-xs" [class]="getTextClasses()">
        {{ post.readTime || '3 min read' }}
      </span>
      <span class="text-primary font-medium text-sm hover:text-purple-600 dark:hover:text-purple-400 transition-colors">
        Read more →
      </span>
    </div>
  </div>
</div>
