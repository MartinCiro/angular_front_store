
<div class="p-4 md:p-8 space-y-6">
  <div class="bg-white dark:bg-card-dark rounded-xl border border-slate-200 dark:border-slate-800 p-6">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold">Gestión de Usuarios</h2>
      <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors flex items-center gap-2">
        <i-lucide [name]="UserPlus" class="w-4 h-4"></i-lucide>
        Nuevo Usuario
      </button>
    </div>
    
    <p class="text-subtle-text mb-6">
      Administra todos los usuarios del sistema, asigna roles y gestiona permisos.
    </p>
    
    <!-- Tabla de usuarios -->
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 dark:bg-card-hover">
          <tr>
            <th class="p-3 text-left">Usuario</th>
            <th class="p-3 text-left">Email</th>
            <th class="p-3 text-left">Rol</th>
            <th class="p-3 text-left">Fecha de Ingreso</th>
            <th class="p-3 text-left">Estado</th>
            <th class="p-3 text-left">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (user of users; track user.id) {
            <tr class="border-t border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50">
              <td class="p-3">
                <div class="flex items-center gap-3">
                  <div class="size-8 rounded-full bg-cover bg-center"
                       [style.background-image]="'url(' + user.avatar + ')'"></div>
                  <span class="font-medium">{{ user.name }}</span>
                </div>
              </td>
              <td class="p-3">{{ user.email }}</td>
              <td class="p-3">
                <span class="px-2 py-1 text-xs rounded-full bg-primary/10 text-primary">
                  {{ user.role }}
                </span>
              </td>
              <td class="p-3">{{ user.joinDate }}</td>
              <td class="p-3">
                <span class="px-2 py-1 text-xs rounded-full"
                      [ngClass]="getStatusColor(user.status)">
                  {{ getStatusText(user.status) }}
                </span>
              </td>
              <td class="p-3">
                <div class="flex gap-2">
                  <button class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded" title="Editar">
                    <i-lucide [name]="Edit" class="w-4 h-4 text-blue-500"></i-lucide>
                  </button>
                  <button class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded" title="Eliminar">
                    <i-lucide [name]="Trash2" class="w-4 h-4 text-red-500"></i-lucide>
                  </button>
                  <button class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded" title="Ver perfil">
                    <i-lucide [name]="Eye" class="w-4 h-4 text-green-500"></i-lucide>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
