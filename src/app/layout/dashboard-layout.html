<!-- Main Layout Container -->
<div class="flex flex-col min-h-screen bg-background-light dark:bg-background-dark text-slate-900 dark:text-white transition-colors duration-300">
  
  <!-- Main Content Area -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- Sidebar Overlay (Mobile) -->
    @if (isMobileMenuOpen()) {
      <div class="fixed inset-0 bg-black/50 z-40 lg:hidden backdrop-blur-sm" 
           (click)="toggleMobileMenu()"></div>
    }
    
    <!-- Sidebar -->
    <aside [class]="sidebarClasses()" 
           role="navigation" 
           aria-label="Navegación principal">
      
      <!-- Sidebar Content -->
      <div class="flex flex-col justify-between p-4 flex-1 overflow-y-auto">
        
        <!-- Navigation Sections -->
        <div class="flex flex-col gap-6">
          
          <!-- Main Navigation -->
          <nav class="flex flex-col gap-1">
            @for (item of mainNavItems(); track item.label) {
              @if (item.type === 'item') {
                <a [routerLink]="item.route || '#'"
                   [class]="(item.isActive ? 'bg-primary text-white shadow-md' : 'text-slate-500 dark:text-subtle-text hover:bg-slate-100 dark:hover:bg-surface-dark') + ' flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all'"
                   (click)="onNavItemClick(item)">
                  <i-lucide [name]="item.icon" class="w-5 h-5"></i-lucide>
                  <p class="text-sm font-medium">{{ item.label }}</p>
                </a>
              }
            }
          </nav>
          
          <!-- Divider -->
          <div class="h-px w-full bg-slate-200 dark:bg-slate-800"></div>
          
          <!-- System Navigation -->
          <nav class="flex flex-col gap-2">
            <p class="px-3 text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
              Sistema
            </p>
            @for (item of systemNavItems(); track item.label) {
              <a [routerLink]="item.route || '#'"
                 class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-500 dark:text-subtle-text hover:bg-slate-100 dark:hover:bg-surface-dark transition-colors"
                 (click)="onNavItemClick(item)">
                <i-lucide [name]="item.icon" class="w-5 h-5"></i-lucide>
                <p class="text-sm font-medium">{{ item.label }}</p>
              </a>
            }
          </nav>
          
        </div>
        
        <!-- User Profile Card -->
        <div class="mt-6">
          <div class="flex items-center gap-3 rounded-xl border border-slate-200 dark:border-slate-800 p-3 bg-slate-50 dark:bg-surface-dark">
            <div class="size-10 rounded-full bg-cover bg-center flex-shrink-0" 
                 [style.background-image]="'url(' + userInfo().avatar + ')'"></div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold truncate">{{ userInfo().name }}</p>
              <p class="text-xs text-slate-500 dark:text-subtle-text truncate">{{ userInfo().role }}</p>
            </div>
            <!-- 🔹 Botón de logout eliminado (se maneja desde el navbar) -->
          </div>
        </div>
        
      </div>
    </aside>
    
    <!-- Main Content -->
    <main [class]="mainContentClasses()" 
          class="flex-1 flex flex-col relative overflow-hidden transition-all duration-300">
      
      <!-- Projected Content (Dashboard Pages) -->
      <div class="flex-1 overflow-y-auto scroll-smooth">
        <router-outlet></router-outlet>
      </div>
      
    </main>
    
  </div>
</div>
